<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>

</header>
<!-- Chat Header Context -->
<div class="px-container-margin py-stack-sm bg-surface border-b border-border-subtle flex items-center justify-between shrink-0">
<div class="flex flex-col">
<h2 class="text-body-lg font-body-lg font-semibold tracking-tight text-on-surface">Chat de Cancha 2</h2>
<div class="flex items-center gap-2 mt-1">
<span class="w-2 h-2 rounded-full bg-status-ok"></span>
<span class="text-label-muted font-label-muted text-text-secondary">4 participantes</span>
</div>
</div>
<div class="flex items-center gap-2">
<!-- Group avatars overview -->
<div class="flex -space-x-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high border-2 border-surface flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A macro shot of a padel ball lying on a textured sports court surface, bright natural daylight, conveying readiness for a match." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCw-Sk7_R_EDZYUYwhuybyKIJh1QWcQVEVrmLuIqQgUqU3rvD-zagdstmvHkC_4xlJkxjeSdTueZ7Ip0tOZ9Ln0i9M-b42OHNn_udOOb2rGEtGwxEqG3nZ3nOpOoqNBXfJWTiSmkYfFZf_-DmRebg1D-Xh72GotSU0wJY1cF_1-gF6FtgPmEQvhNYtnu5zWWkA2lSLGoOMbra5x-MHR6BFzsgK0a4bK6AHRmDb6Niw4aIg6ZBYUxJQ"/>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-high border-2 border-surface flex items-center justify-center overflow-hidden">
<span class="text-label-caps font-label-caps text-secondary">M</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-high border-2 border-surface flex items-center justify-center overflow-hidden">
<span class="text-label-caps font-label-caps text-secondary">+2</span>
</div>
</div>
</div>
</div>
<!-- Chat Canvas -->
<main class="flex-1 overflow-y-auto px-container-margin py-stack-md flex flex-col gap-stack-md bg-surface-bright pb-24">
<!-- Date divider -->
<div class="flex justify-center">
<span class="px-4 py-1 bg-surface-container-low text-text-secondary text-label-caps font-label-caps rounded-full border border-border-subtle">HOY</span>
</div>
<!-- Incoming Message Bubble (Left) -->
<div class="flex items-end gap-inline-gutter group">
<div class="w-8 h-8 rounded-full bg-surface-container flex-shrink-0 overflow-hidden shadow-sm">
<img class="w-full h-full object-cover" data-alt="A portrait of a male player holding a padel racket, looking enthusiastic, high contrast lighting, modern athletic aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD7gImPUw-UBNISyTjUK-0oPQGtHM2khRLRYOs_cQuurIZ8wbP0tDiZOJG4Sf7UQjisA__ABeKXAqGg0HEDbJds3tzgy_8Z5qzQrwrrFedXGweFArDRwSfshmZCk2UXKgZ97qI9b5HtWHI0mJz1EHs2cJhJU1PGtg08iSgN2VZZuLsW_V-dKIbyQf7cg03fOYzURVK_XYvtkNs3n_RjCsEYXvvjwJIRa6LnlP2ryCOCKLfDtBdhL0I"/>
</div>
<div class="flex flex-col gap-1 max-w-[75%]">

<div class="bg-inverse-surface text-inverse-on-surface p-4 rounded-2xl rounded-bl-none shadow-sm transition-transform group-hover:-translate-y-0.5">
<p class="text-body-md font-body-md leading-snug">Che, ¿alguien lleva pelotas?</p>
</div>
<span class="text-[11px] text-text-secondary ml-1">14:23</span>
</div>
</div>
<!-- Outgoing Message Bubble (Right - Mateo) -->
<div class="flex items-end gap-inline-gutter flex-row-reverse group">
<div class="w-8 h-8 rounded-full bg-primary-container flex-shrink-0 overflow-hidden shadow-sm flex items-center justify-center">
<span class="text-label-caps font-label-caps text-on-primary-container">M</span>
</div>
<div class="flex flex-col gap-1 items-end max-w-[75%]">
<span class="text-label-muted font-label-muted text-text-secondary mr-1">Tú</span>
<div class="bg-primary-container text-on-primary-container p-4 rounded-2xl rounded-br-none shadow-sm transition-transform group-hover:-translate-y-0.5">
<p class="text-body-md font-body-md leading-snug">Yo llevo un tubo nuevo</p>
</div>
<div class="flex items-center gap-1 mr-1">
<span class="text-[11px] text-text-secondary">14:25</span>
<span class="material-symbols-outlined text-[14px] text-status-ok">done_all</span>
</div>
</div>
</div>
<!-- Incoming Message Bubble (Left) -->
<div class="flex items-end gap-inline-gutter group">
<div class="w-8 h-8 rounded-full bg-surface-container flex-shrink-0 overflow-hidden shadow-sm">

</div>
<div class="flex flex-col gap-1 max-w-[75%]">
<span class="text-label-muted font-label-muted text-text-secondary ml-1">Sebas</span>
<div class="bg-inverse-surface text-inverse-on-surface p-4 rounded-2xl rounded-bl-none shadow-sm transition-transform group-hover:-translate-y-0.5">
<p class="text-body-md font-body-md leading-snug">Dale, nos vemos ahí</p>
</div>
<span class="text-[11px] text-text-secondary ml-1">14:26</span>
</div>
</div>
</main>
<!-- Bottom Input Area -->
<div class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-md border-t border-border-subtle p-4 px-container-margin z-50">
<div class="flex items-center gap-3 bg-surface-container-lowest border border-border-subtle rounded-full pr-2 pl-4 py-2 shadow-sm focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<button aria-label="Adjuntar archivo" class="text-text-secondary hover:text-on-surface transition-colors p-1 flex-shrink-0">
<span class="material-symbols-outlined">attach_file</span>
</button>
<input class="flex-1 bg-transparent border-none p-0 focus:ring-0 text-body-md font-body-md text-on-surface placeholder-text-secondary h-10" placeholder="Escribe un mensaje..." type="text"/>
<button aria-label="Enviar" class="w-10 h-10 rounded-full bg-inverse-surface text-inverse-on-surface flex items-center justify-center hover:bg-on-surface transition-colors flex-shrink-0 shadow-sm">
<span class="material-symbols-outlined text-[20px] -ml-0.5">send</span>
</button>
</div>
<!-- Safe area spacing for mobile home indicator -->
<div class="h-safe-area-bottom w-full"></div>
</div>
